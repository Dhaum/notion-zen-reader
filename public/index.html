<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>제2의 뉴런 (Zen Reader)</title>
  
  <!-- PWA 메타 태그 -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="제2의 뉴런">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png">

  <link rel="stylesheet" href="/css/app.css?v=20261115_v20">
</head>
<body class="theme-dark font-md">

  <!-- 독서 진행률 게이지 -->
  <div id="reading-progress-bar"></div>

  <!-- 상단 네비게이션 헤더 -->
  <header class="zen-header">
    <div class="zen-header-left">
      <div class="zen-logo" onclick="App.showView('list')">
        <svg class="zen-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span>제2의 뉴런</span>
      </div>
      <div id="network-status-badge" class="badge-status badge-online">
        <span class="status-dot dot-live" aria-hidden="true"></span><span>온라인</span>
      </div>
    </div>
    <div class="zen-header-right">
      <button id="btn-install-pwa" class="btn btn-icon" onclick="App.installPWA()" title="태블릿에 앱 설치" aria-label="태블릿에 앱 설치" style="display: none;">
        <svg class="zen-svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      </button>
      <button id="header-offline-btn" class="btn btn-icon" onclick="App.downloadAllForOffline()" title="미저장·수정 문서 오프라인 저장" aria-label="오프라인 일괄 저장">
        <svg class="zen-svg icon-spin-target" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
      </button>
      <button class="btn btn-icon" onclick="App.cycleFontSize()" title="글자 크기 변경" aria-label="글자 크기 변경">
        <span class="btn-icon-text">가</span>
      </button>
      <button class="btn btn-icon" onclick="App.toggleTheme()" title="화면 테마 변경" aria-label="화면 테마 변경">
        <svg class="zen-svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3v18"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" fill-opacity="0.22"/></svg>
      </button>
      <button id="header-refresh-btn" class="btn btn-icon" onclick="App.handleHeaderRefresh()" title="노션 최신 동기화" aria-label="노션 최신 동기화">
        <svg class="zen-svg icon-spin-target" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>
      </button>
    </div>
  </header>

  <!-- 메인 뷰 컨테이너 -->
  <main class="container">
    
    <!-- 탭 네비게이션 (서재 / 대시보드 / 데이터 및 설정) -->
    <nav class="nav-tabs">
      <button id="tab-btn-list" class="nav-tab-item active" onclick="App.showView('list')">
        <svg class="zen-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1 0-5H20"/></svg>
        <span>서재</span>
      </button>
      <button id="tab-btn-dashboard" class="nav-tab-item" onclick="App.showView('dashboard')">
        <svg class="zen-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>
        <span>학습 대시보드</span>
      </button>
      <button id="tab-btn-settings" class="nav-tab-item" onclick="App.showView('settings')">
        <svg class="zen-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9c.26.6.77 1.02 1.42 1.15H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>데이터·설정</span>
      </button>
    </nav>

    <!-- 1. 서재 (목록 뷰) -->
    <section id="view-list">
      <!-- 검색창 및 온디맨드 태그 모아보기 버튼 바 -->
      <div class="search-and-tag-bar">
        <div class="search-input-wrap">
          <svg class="search-input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          <input type="text" id="doc-search-input" class="doc-search-bar" placeholder="문서 제목, 태그, 카테고리 검색..." oninput="App.filterDocuments(this.value)">
        </div>
        <button id="btn-toggle-tag-sheet" class="btn btn-tag-toggle" onclick="App.toggleTagSheet()" title="주요 임상 태그 모아보기">
          <svg class="zen-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2H2v10l9.29 9.29c.94.94 2.48.94 3.42 0l6.58-6.58c.94-.94.94-2.48 0-3.42L12 2Z"/><path d="M7 7h.01"/></svg>
          <span class="btn-tag-text">태그</span>
        </button>
      </div>
      
      <!-- 상태 필터 & 생성 시각 정렬 컨트롤 -->
      <div class="filter-controls-row">
        <!-- 상태 필터 (전체 / 완료 / 진행 중 / 시작 전) -->
        <div class="status-filter-pills">
          <button class="status-pill active" data-status="all" onclick="App.setStatusFilter('all')">
            전체 <span id="count-all" class="pill-count">0</span>
          </button>
          <button class="status-pill" data-status="완료" onclick="App.setStatusFilter('완료')">
            <span class="status-dot dot-done" aria-hidden="true"></span>완료 <span id="count-done" class="pill-count">0</span>
          </button>
          <button class="status-pill" data-status="진행 중" onclick="App.setStatusFilter('진행 중')">
            <span class="status-dot dot-progress" aria-hidden="true"></span>진행 중 <span id="count-progress" class="pill-count">0</span>
          </button>
          <button class="status-pill" data-status="시작 전" onclick="App.setStatusFilter('시작 전')">
            <span class="status-dot dot-todo" aria-hidden="true"></span>시작 전 <span id="count-todo" class="pill-count">0</span>
          </button>
        </div>

        <!-- 정렬 선택 & 오프라인 전용 필터 -->
        <div class="sort-control-box">
          <button id="btn-offline-only-filter" class="offline-filter-pill" onclick="App.toggleOfflineOnlyFilter()" title="오프라인 열람 가능 문서만 모아보기">
            <svg class="zen-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            <span>오프라인만</span>
            <span id="count-offline" class="pill-count">0</span>
          </button>
          <select id="sort-select" class="sort-select" onchange="App.setSortOrder(this.value)">
            <option value="created_desc" selected>생성일 최신순</option>
            <option value="created_asc">생성일 과거순</option>
            <option value="updated_desc">최근 수정순</option>
            <option value="title_asc">가나다순 (제목)</option>
          </select>
        </div>
      </div>

      <div id="doc-card-list" class="doc-card-list">
        <!-- 자바스크립트로 렌더링 -->
      </div>
    </section>

    <!-- 2. 리더 모드 (8.4인치 태블릿 본문 뷰) -->
    <section id="view-reader" class="reader-container" style="display: none;">
      <div id="reader-content">
        <!-- 자바스크립트로 렌더링 -->
      </div>
    </section>

    <!-- 3. 학습 대시보드 (데스크탑 모니터링 뷰) -->
    <section id="view-dashboard" style="display: none;">
      <div id="dashboard-content">
        <!-- 자바스크립트로 렌더링 -->
      </div>
    </section>

    <!-- 4. 데이터 및 설정 (신규 통합 뷰) -->
    <section id="view-settings" style="display: none;">
      <div id="settings-content">
        <!-- 자바스크립트로 렌더링 -->
      </div>
    </section>

  </main>

  <!-- 8.4인치 태블릿 알도큐브 내추럴 썸 존 슬림 플로팅 아일랜드 독 -->
  <div id="zen-dock-feedback-popover" class="zen-dock-feedback-popover" style="display: none;">
    <div id="dock-feedback-popover-title" class="dock-fb-header">기억 체감도 선택</div>
    <div class="dock-fb-options">
      <button id="dock-fb-easy" class="dock-fb-btn dock-fb-easy" onclick="Reader.selectFeedbackFromDock('easy')">
        <span class="fb-dot dot-easy" aria-hidden="true"></span><span>수월함</span>
      </button>
      <button id="dock-fb-good" class="dock-fb-btn dock-fb-good" onclick="Reader.selectFeedbackFromDock('good')">
        <span class="fb-dot dot-good" aria-hidden="true"></span><span>적정</span>
      </button>
      <button id="dock-fb-hard" class="dock-fb-btn dock-fb-hard" onclick="Reader.selectFeedbackFromDock('hard')">
        <span class="fb-dot dot-hard" aria-hidden="true"></span><span>헷갈림</span>
      </button>
    </div>
  </div>
  <aside id="zen-floating-dock" class="zen-floating-dock" style="display: none;">
    <button class="dock-btn dock-btn-subtle" onclick="Reader.goBack()" title="서재 목록으로 돌아가기">
      <svg class="zen-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      <span class="dock-label">서재</span>
    </button>
    <div class="dock-separator"></div>
    <div class="dock-timer-badge" title="현재 집중 학습 시간">
      <svg class="zen-svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15 14"/></svg>
      <span id="dock-timer-display" class="dock-mono">00:00</span>
    </div>
    <div class="dock-separator"></div>
    <button class="dock-btn dock-btn-subtle" onclick="Reader.toggleAllSelfTests()" title="모든 암기 토글 열기/닫기">
      <span id="dock-toggle-icon" class="dock-icon">
        <svg class="zen-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
      </span>
      <span id="dock-toggle-label" class="dock-label">토글</span>
    </button>
    <div class="dock-separator"></div>
    <button id="dock-checkin-btn" class="dock-btn dock-btn-accent" onclick="Reader.toggleDockFeedbackPicker()" title="기억 체감도 선택 및 오늘 1회독 체크인">
      <svg class="zen-svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="dock-label">완료</span>
    </button>
  </aside>

  <!-- 온디맨드 주요 태그 모아보기 바텀시트 -->
  <div id="tag-sheet-backdrop" class="sheet-backdrop" onclick="App.toggleTagSheet(false)" style="display: none;"></div>
  <div id="tag-sheet" class="bottom-sheet" style="display: none;">
    <div class="sheet-handle-bar">
      <div class="sheet-handle"></div>
    </div>
    <div class="sheet-header">
      <div class="sheet-title">주요 임상 태그</div>
      <button class="sheet-close-btn" onclick="App.toggleTagSheet(false)" title="닫기">✕</button>
    </div>
    <div id="tag-sheet-chips" class="tag-sheet-grid">
      <!-- 자바스크립트로 Top 25+ 태그 및 빈도수 렌더링 -->
    </div>
  </div>

  <!-- PIN 번호 보안 잠금 모달 -->
  <div id="pin-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="pin-modal-icon" aria-hidden="true">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
      </div>
      <h2 style="font-size: 1.15rem; font-weight: 700; margin-bottom: 6px;">서재 잠금 해제</h2>
      <p style="font-size: 0.84rem; color: var(--text-muted); line-height: 1.5;">
        태블릿 접근 보호를 위한 4자리 PIN 번호를 입력하세요.
      </p>
      <input type="password" id="pin-code-input" class="pin-input" maxlength="4" placeholder="••••" autofocus onkeydown="if(event.key==='Enter') App.verifyPin()">
      <div id="pin-error-msg" style="color: var(--danger); font-size: 0.8rem; display: none; margin-bottom: 12px;">
        PIN 번호가 일치하지 않습니다.
      </div>
      <button class="btn btn-primary" style="width: 100%; justify-content: center; padding: 11px; font-size: 0.95rem;" onclick="App.verifyPin()">
        잠금 해제
      </button>
    </div>
  </div>

  <!-- 스크립트 로딩 -->
  <script src="/js/storage-idb.js?v=20261115_v20"></script>
  <script src="/js/offline.js?v=20261115_v20"></script>
  <script src="/js/reader.js?v=20261115_v20"></script>
  <script src="/js/dashboard.js?v=20261115_v20"></script>
  <script src="/js/settings.js?v=20261115_v20"></script>
  <script src="/js/app.js?v=20261115_v20"></script>
</body>
</html>
