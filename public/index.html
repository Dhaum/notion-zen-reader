<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>노션 지식 리더 (Zen Reader)</title>
  
  <!-- PWA 메타 태그 -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="지식서재">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon.png">

  <link rel="stylesheet" href="/css/app.css?v=20261106_v10">
</head>
<body class="theme-dark font-md">

  <!-- 독서 진행률 게이지 -->
  <div id="reading-progress-bar"></div>

  <!-- 상단 네비게이션 헤더 -->
  <header class="zen-header">
    <div class="zen-header-left">
      <div class="zen-logo" onclick="App.showView('list')">
        <span>📖</span>
        <span>지식 서재</span>
      </div>
      <div id="network-status-badge" class="badge-status badge-online">
        ● 온라인
      </div>
    </div>
    <div class="zen-header-right">
      <button id="btn-install-pwa" class="btn btn-icon" onclick="App.installPWA()" title="태블릿에 앱 설치" style="display: none;">📲</button>
      <button class="btn btn-icon" onclick="App.downloadAllForOffline()" title="전체 문서 오프라인 일괄 다운로드">📦</button>
      <button class="btn btn-icon" onclick="App.cycleFontSize()" title="글자 크기 변경">🔤</button>
      <button class="btn btn-icon" onclick="App.toggleTheme()" title="화면 테마 변경">🌓</button>
      <button id="header-refresh-btn" class="btn btn-icon" onclick="App.handleHeaderRefresh()" title="노션 최신 동기화">🔄</button>
    </div>
  </header>

  <!-- 메인 뷰 컨테이너 -->
  <main class="container">
    
    <!-- 탭 네비게이션 (서재 / 대시보드) -->
    <nav class="nav-tabs">
      <button id="tab-btn-list" class="nav-tab-item active" onclick="App.showView('list')">📚 지식 서재</button>
      <button id="tab-btn-dashboard" class="nav-tab-item" onclick="App.showView('dashboard')">📊 학습 대시보드</button>
    </nav>

    <!-- 1. 지식 서재 (목록 뷰) -->
    <section id="view-list">
      <input type="text" class="doc-search-bar" placeholder="🔍 문서 제목, 태그, 카테고리 검색..." oninput="App.filterDocuments(this.value)">
      
      <!-- 상태 필터 & 생성 시각 정렬 컨트롤 -->
      <div class="filter-controls-row">
        <!-- 상태 필터 (전체 / 완료 / 진행 중 / 시작 전) -->
        <div class="status-filter-pills">
          <button class="status-pill active" data-status="all" onclick="App.setStatusFilter('all')">
            전체 <span id="count-all" style="opacity: 0.8; font-size: 0.75rem;">0</span>
          </button>
          <button class="status-pill" data-status="완료" onclick="App.setStatusFilter('완료')">
            🟢 완료 <span id="count-done" style="opacity: 0.8; font-size: 0.75rem;">0</span>
          </button>
          <button class="status-pill" data-status="진행 중" onclick="App.setStatusFilter('진행 중')">
            🔵 진행 중 <span id="count-progress" style="opacity: 0.8; font-size: 0.75rem;">0</span>
          </button>
          <button class="status-pill" data-status="시작 전" onclick="App.setStatusFilter('시작 전')">
            ⚪ 시작 전 <span id="count-todo" style="opacity: 0.8; font-size: 0.75rem;">0</span>
          </button>
        </div>

        <!-- 정렬 선택 (생성일 오름/내림차순 등) -->
        <div class="sort-control-box">
          <select id="sort-select" class="sort-select" onchange="App.setSortOrder(this.value)">
            <option value="created_desc" selected>📅 생성일 최신순 (▼)</option>
            <option value="created_asc">📅 생성일 과거순 (▲)</option>
            <option value="updated_desc">🔄 최근 수정순</option>
            <option value="title_asc">🔤 가나다순 (제목)</option>
          </select>
        </div>
      </div>

      <div id="doc-card-list" class="doc-card-list">
        <!-- 자바스크립트로 렌더링 -->
      </div>
    </section>

    <!-- 2. 리더 모드 (8.4인치 태블릿 본문 뷰) -->
    <section id="view-reader" class="reader-container" style="display: none;">
      <div id="reader-content">
        <!-- 자바스크립트로 렌더링 -->
      </div>
    </section>

    <!-- 3. 학습 대시보드 (데스크탑 모니터링 뷰) -->
    <section id="view-dashboard" style="display: none;">
      <div id="dashboard-content">
        <!-- 자바스크립트로 렌더링 -->
      </div>
    </section>

  </main>

  <!-- 8.4인치 태블릿 알도큐브 내추럴 썸 존 슬림 플로팅 아일랜드 독 -->
  <aside id="zen-floating-dock" class="zen-floating-dock" style="display: none;">
    <button class="dock-btn dock-btn-subtle" onclick="App.showView('list')" title="서재 목록으로 돌아가기">
      <span class="dock-icon">◀</span>
      <span class="dock-label">서재</span>
    </button>
    <div class="dock-separator"></div>
    <div class="dock-timer-badge" title="현재 집중 학습 시간">
      <span class="dock-icon">⏱</span>
      <span id="dock-timer-display" class="dock-mono">00:00</span>
    </div>
    <div class="dock-separator"></div>
    <button class="dock-btn dock-btn-subtle" onclick="Reader.toggleAllSelfTests()" title="모든 암기 토글 열기/닫기">
      <span id="dock-toggle-icon" class="dock-icon">👁️</span>
      <span id="dock-toggle-label" class="dock-label">토글</span>
    </button>
    <div class="dock-separator"></div>
    <button id="dock-checkin-btn" class="dock-btn dock-btn-accent" onclick="Reader.triggerManualCheckin('good')" title="오늘 1회독 체크인">
      <span class="dock-icon">🎯</span>
      <span class="dock-label">완료</span>
    </button>
  </aside>

  <!-- PIN 번호 보안 잠금 모달 -->
  <div id="pin-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div style="font-size: 2.2rem; margin-bottom: 8px;">🔐</div>
      <h2 style="font-size: 1.25rem; font-weight: 700; margin-bottom: 6px;">서재 잠금 해제</h2>
      <p style="font-size: 0.85rem; color: var(--text-muted); line-height: 1.5;">
        알도큐브 태블릿 보호를 위한 4자리 PIN 번호를 입력하세요. (기본값: 1234)
      </p>
      <input type="password" id="pin-code-input" class="pin-input" maxlength="4" placeholder="••••" autofocus onkeydown="if(event.key==='Enter') App.verifyPin()">
      <div id="pin-error-msg" style="color: var(--danger); font-size: 0.8rem; display: none; margin-bottom: 12px;">
        PIN 번호가 일치하지 않습니다.
      </div>
      <button class="btn btn-primary" style="width: 100%; padding: 12px; font-size: 1rem;" onclick="App.verifyPin()">
        입장하기
      </button>
    </div>
  </div>

  <!-- 스크립트 로딩 -->
  <script src="/js/storage-idb.js?v=20261106_v8"></script>
  <script src="/js/offline.js?v=20261106_v8"></script>
  <script src="/js/reader.js?v=20261106_v8"></script>
  <script src="/js/dashboard.js?v=20261106_v8"></script>
  <script src="/js/app.js?v=20261106_v8"></script>
</body>
</html>
